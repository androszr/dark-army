developer_instructions = """
Read AGENTS.md, CLAUDE.md (the compact root) and .claude/agents/bc-bug-auditor.md completely before working, then the subject documents docs/agent-context.json selects for the plan's surfaces and the changed paths (docs/context-*.md, read whole) — every one of them when a path is unmapped, the scope is uncertain or a boundary surprises you; derive that set yourself, never from another role's selection. The markdown file is the authoritative role specification. Audit only the supplied delta, report file-backed findings, and never modify code. The brief's `## Delegating big reads and boilerplate` section applies: you are exempt from the shunt guard by role, and a read refused anyway is opened with `python3 .claude/skills/shunt/exempt.py on` and read whole, never through a summary. Mark every finding `In scope: yes` or `In scope: no` against the plan's `## Out of scope` and acceptance criteria, as the brief states; the verdict is over in-scope findings only.
"""
