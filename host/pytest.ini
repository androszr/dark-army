[pytest]
# The suite is tests/. The agent pack ships its own guard tests for the
# project it is installed into (`{{APP}}` placeholders and all); they are
# not this repository's tests and fail here by design.
testpaths = tests
# Every test gets a ceiling so one hung subprocess or socket can never
# hold the whole suite -- the 21 Sep 2026 ship audit found the full suite at
# 9-10 minutes under fleet contention with no way to tell a hang from a slow
# run. Parallel workers are chosen per command (`-n auto` on the full suite),
# never here, so a single-file run stays a single process.
timeout = 300
# With workers (-n), keep a file's tests on one worker: module-scoped
# fixtures (the phone's swiftc builds) are built once, not once per worker.
addopts = --dist loadfile
timeout_method = thread
